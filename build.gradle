def forgeGradlew = { String task ->
    def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
    [isWindows ? 'gradlew.bat' : './gradlew', task]
}

['Build': 'build', 'Assemble': 'assemble', 'Clean': 'clean', 'RunClient': 'runClient', 'RunServer': 'runServer'].each { suffix, forgeTask ->
    tasks.register("forge1201${suffix}", Exec) {
        workingDir file('forge-1201')
        commandLine forgeGradlew(forgeTask)
    }
}
