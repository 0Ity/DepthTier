plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev' version '2.0.141'
}

def mcVersion = '1.21.1'

base {
    archivesName = "${mod_id}-neoforge-${mcVersion}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Include shared MC 1.21.1 sources
sourceSets.main {
    java.srcDir rootProject.file('shared/mc1211/java')
    resources.srcDir rootProject.file('shared/mc1211/resources')
}

neoForge {
    version = '21.1.77'

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }

    parchment {
        minecraftVersion = '1.21'
        mappingsVersion = '2024.07.28'
    }

    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} 1.21.1"
        }
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "maven.modrinth:jade:15.10.5+neoforge"
    runtimeOnly "maven.modrinth:jade:15.10.5+neoforge"
}

processResources {
    var expandProps = [
        'version'                      : version,
        'mod_name'                     : mod_name,
        'mod_id'                       : mod_id,
        'mod_author'                   : mod_author,
        'license'                      : license,
        'description'                  : mod_description,
        'minecraft_version'            : mcVersion,
        'minecraft_version_range'      : '[1.21.1, 1.22)',
        'neoforge_version'             : '21.1.77',
        'neoforge_loader_version_range': '[4,)',
        'java_version'                 : '21',
    ]
    filesMatching(['pack.mcmeta', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Copies the built jar into the test modpack's mods folder (path from
// gradle.properties). Skipped when the folder does not exist (e.g. CI).
def deployModpack = tasks.register('deployModpack') {
    group = 'distribution'
    description = 'Copies the mod jar into the test modpack mods folder.'
    dependsOn tasks.named('jar')

    def modsDir = providers.gradleProperty('modpack_mods_dir')
    onlyIf {
        def dir = modsDir.getOrNull()
        if (!dir) {
            logger.lifecycle('deployModpack: modpack_mods_dir not set, skipping')
            return false
        }
        if (!file(dir).exists()) {
            logger.lifecycle("deployModpack: mods folder not found ($dir), skipping")
            return false
        }
        return true
    }

    doLast {
        def dest = file(modsDir.get())
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile

        def oldNames = ['depthtier', 'betterharvestlevels', 'betterharvestlevel']
        dest.listFiles()?.findAll { f ->
            f.name.endsWith('.jar') && oldNames.any { f.name.startsWith(it) }
        }?.each {
            logger.lifecycle("deployModpack: removing old ${it.name}")
            if (!it.delete()) {
                throw new GradleException("deployModpack: could not delete ${it.name} (is Minecraft running?)")
            }
        }

        def target = dest.toPath().resolve(jarFile.name)
        java.nio.file.Files.copy(jarFile.toPath(), target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("deployModpack: deployed ${jarFile.name} -> ${dest}")
    }
}

tasks.named('build').configure { finalizedBy(deployModpack) }
