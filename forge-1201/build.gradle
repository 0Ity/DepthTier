plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main {
    java.srcDirs += file('../common/src/main/java')
    java.srcDirs += file('../shared/mc1201/java')
    resources.srcDirs += file('../shared/mc1201/resources')
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}"
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            jvmArgs(
                "-Dmixin.env.remapRefMap=true",
                "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
            )
        }
        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('maven.modrinth:jade:11.12.3+forge')
    runtimeOnly fg.deobf('maven.modrinth:jade:11.12.3+forge')
}

processResources {
    var expandProps = [
        'version'    : version,
        'mod_name'   : mod_name,
        'mod_id'     : mod_id,
        'mod_author' : mod_author,
        'license'    : license,
        'description': mod_description,
    ]
    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
