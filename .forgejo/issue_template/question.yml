name: Question / Support
description: Ask a question about using DepthTier
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Need help with DepthTier? Ask your question below.
        Check the [documentation](https://tysontheember.dev/better-harvest-levels/intro/) first - your answer might already be there!

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant details - what you've tried, your setup, config snippets, etc.
    validations:
      required: false

  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader (if applicable)
      options:
        - NeoForge 1.21.1
        - N/A
    validations:
      required: false
