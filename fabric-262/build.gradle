plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom' version '1.15.5'
}

def mcVersion = '26.2'

base {
    archivesName = "${mod_id}-fabric-26.2"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets.main {
    java.srcDir rootProject.file('shared/mc26x/java')
    resources.srcDir rootProject.file('shared/mc26x/resources')
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.152.2+26.2'
    compileOnly 'maven.modrinth:jade:26.2.8+fabric'
    runtimeOnly 'maven.modrinth:jade:26.2.8+fabric'
}

processResources {
    var expandProps = [
        'version'    : version,
        'mod_name'   : mod_name,
        'mod_id'     : mod_id,
        'mod_author' : mod_author,
        'license'    : license,
        'description': description,
    ]
    filesMatching(['pack.mcmeta', 'fabric.mod.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
