pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'MinecraftForge'; url = uri('https://maven.minecraftforge.net/') }
        maven { name = 'NeoForge'; url = uri('https://maven.neoforged.net/releases') }
        maven { name = 'Fabric'; url = uri('https://maven.fabricmc.net/') }
        maven { name = 'Parchment'; url = uri('https://maven.parchmentmc.org') }
        maven { name = 'Sponge'; url = uri('https://repo.spongepowered.org/repository/maven-public/') }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'BetterHarvestLevels'
include 'common'
include 'neoforge-1211'
include 'neoforge-261'
include 'neoforge-262'
include 'fabric-1211'
include 'fabric-261'
include 'fabric-262'
include 'fabric-1201'
